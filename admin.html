<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Teams</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">
    <div id="admin-content" style="display: none;">
        <nav class="navbar">
            <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <span class="brand">Admin<span>Panel</span></span>
                    <div class="view-toggle">
                        <button id="btnViewTeams" class="btn-toggle active" onclick="window.switchView('teams')">Команды</button>
                        <button id="btnViewSolo" class="btn-toggle" onclick="window.switchView('solo')">Соло</button>
                    </div>
                </div>
                
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span id="userEmail" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;"></span>
                    <button id="logoutBtn" class="btn-secondary" onclick="window.logout()">Выйти</button>
                </div>
            </div>
        </nav>

        <main class="content-container">
            <div class="global-stats-panel">
                <div class="stat-box">
                    <span class="stat-icon">👥</span>
                    <div>
                        <div class="stat-label">Всего участников</div>
                        <div class="stat-value" id="globalTotal">0</div>
                    </div>
                </div>
                <div class="stat-box success">
                    <span class="stat-icon">✅</span>
                    <div>
                        <div class="stat-label">Пришло участников</div>
                        <div class="stat-value" id="globalArrived">0</div>
                    </div>
                </div>
            </div>

            <header class="content-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h1 id="pageTitle" style="margin: 0; margin-bottom: 5px;">Все команды</h1>
                    <p id="stats" style="margin: 0; color: var(--text-muted);">Загрузка данных...</p>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." onkeyup="window.renderCurrentView()">
                </div>
            </header>
            
            <div class="card table-card" id="teamsContainer">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 250px;">Команда</th>
                                <th>Состав (Лидер и участники)</th>
                            </tr>
                        </thead>
                        <tbody id="teamsTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card table-card" id="soloContainer" style="display: none;">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 350px;">Участник</th>
                                <th>Контакты</th>
                                <th style="width: 150px;">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="soloTableBody"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
